<svg width="28" height="28" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <radialGradient id="disc" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FDB0D3"/>
      <stop offset="55%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#433C58"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F472B6"/>
      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer ring -->
  <circle cx="14" cy="14" r="12" stroke="#FB7185" stroke-width="2.2" opacity="0.95"/>

  <!-- Inner disc with slight glow -->
  <circle cx="14" cy="14" r="7.5" fill="#FB7185" filter="url(#glow)"/>

  <!-- Center dot -->
  <circle cx="14" cy="14" r="2.1" fill="#FB7185"/>
</svg>
